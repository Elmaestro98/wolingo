<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Exercice — prononciation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
@keyframes wl-wave{0%,100%{transform:scaleY(0.35)}50%{transform:scaleY(1)}}
.wl-bar{transform-origin:center;animation:wl-wave 0.8s ease-in-out infinite}
@keyframes wl-pulse{0%{box-shadow:0 0 0 0 rgba(192,38,45,0.35)}100%{box-shadow:0 0 0 28px rgba(192,38,45,0)}}
.wl-rec{animation:wl-pulse 1.2s ease-out infinite}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; flex-shrink: 0">
    <a href="05-parcours.html" aria-label="Quitter la leçon" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la leçon" aria-valuenow="5" aria-valuemin="0" aria-valuemax="5" style="flex-grow: 1; height: 12px; border-radius: 99px; background: #E6DFD3; overflow: hidden">
      <div style="width: 92%; height: 100%; border-radius: 99px; background: #0B5D3B; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12)"></div>
    </div>
    <div aria-label="5 vies" role="img" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 5px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E5484D" stroke="#B42318" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #B42318">5</span>
    </div>
  </div>

  <div style="padding: 4px 20px 0">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5A00">Prononciation</span>
    <h1 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: -0.02em">Répète après Fatou</h1>

    <div style="margin-top: 14px; padding: 18px 16px 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #0B5D3B">xaar</span>
          <span style="font-size: 14px; color: #5E564C"><em style="font-weight: 700; color: #3D3730">[khaar]</em> · attendre</span>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" aria-label="Écouter Fatou lentement" aria-pressed="{{slowAria}}" onClick="{{playSlow}}" style="{{slowStyle}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15c0-4 3.5-7 8-7s8 3 8 7z"></path><path d="M19 13h1.5a1.5 1.5 0 0 0 0-3H19"></path><path d="M6 15v3M15 15v3"></path><path d="M8 8l1.5 3.5M14 8l-1.5 3.5"></path></svg>
          </button>
          <button type="button" aria-label="Écouter Fatou" aria-pressed="{{normAria}}" onClick="{{playNorm}}" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: #0B5D3B; box-shadow: 0 4px 0 #063A24; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          </button>
        </div>
      </div>
      <div style="margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #FCEFC7; display: flex; gap: 8px; align-items: flex-start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M9 18h6M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"></path></svg>
        <span style="font-size: 13px; line-height: 1.4; color: #5A4300">Le <strong lang="wo">x</strong> se dit comme la <em>jota</em> espagnole : un souffle au fond de la gorge, sans forcer.</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px">
    <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <button type="button" aria-label="Commencer l'enregistrement" onClick="{{startRec}}" style="width: 104px; height: 104px; border-radius: 50%; border: none; background: #0B5D3B; box-shadow: 0 6px 0 #063A24, 0 0 0 10px #E3F1E8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v4"></path></svg>
        </button>
        <span style="margin-top: 8px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">À toi de parler</span>
        <span style="font-size: 13.5px; color: #5E564C">Touche le micro, dis « xaar », puis touche encore</span>
      </div>
    </sc-if>

    <sc-if value="{{isRec}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <button type="button" class="wl-rec" aria-label="Arrêter l'enregistrement" onClick="{{stopRec}}" style="width: 104px; height: 104px; border-radius: 50%; border: none; background: #C0262D; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <span style="width: 30px; height: 30px; border-radius: 8px; background: #FFFFFF; display: block"></span>
        </button>
        <div style="margin-top: 8px; height: 32px; display: flex; align-items: center; gap: 4px" aria-hidden="true">
          <sc-for list="{{liveBars}}" as="b" hint-placeholder-count="15">
            <span class="wl-bar" style="{{b.style}}"></span>
          </sc-for>
        </div>
        <span role="status" style="font-size: 15px; font-weight: 800; color: #8E1B20">Enregistrement… 0:01</span>
        <span style="font-size: 13.5px; color: #5E564C">Touche le carré pour arrêter</span>
      </div>
    </sc-if>

    <sc-if value="{{isReview}}" hint-placeholder-val="{{ false }}">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 2px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #5E564C">Compare les deux voix</h2>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
          <button type="button" aria-label="Écouter Fatou" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #0B5D3B; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"></path></svg>
          </button>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 800">Fatou</span>
            <div style="height: 24px; display: flex; align-items: center; gap: 3px" aria-hidden="true">
              <sc-for list="{{modelBars}}" as="b" hint-placeholder-count="22"><span style="{{b.style}}"></span></sc-for>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
          <button type="button" aria-label="Écouter ton essai" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #F2C230; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#3A2A00" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"></path></svg>
          </button>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 800">Toi</span>
            <div style="height: 24px; display: flex; align-items: center; gap: 3px" aria-hidden="true">
              <sc-for list="{{userBars}}" as="b" hint-placeholder-count="22"><span style="{{b.style}}"></span></sc-for>
            </div>
          </div>
        </div>
        <p style="margin: 6px 0 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">Ta prononciation ressemble ?</p>
      </div>
    </sc-if>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px">
    <sc-if value="{{isReview}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{retry}}" style="height: 56px; border-radius: 16px; border: 2px solid #DCD2C2; background: #FFFFFF; box-shadow: 0 4px 0 #DCD2C2; color: #1E1B16; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
          Réessayer
        </button>
        <a href="15-exercice-derem.html" style="height: 56px; border-radius: 16px; background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          Oui, continuer
        </a>
      </div>
    </sc-if>
    <sc-if value="{{notReview}}" hint-placeholder-val="{{ true }}">
      <a href="#passer" style="height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #5E564C; font-size: 15px; font-weight: 800">Je ne peux pas parler maintenant</a>
    </sc-if>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: undefined, audio: null };
  }
  renderVals() {
    const step = this.state.step !== undefined ? this.state.step : (this.props.etape ?? 'ecoute');
    const audio = this.state.audio;
    const live = [10, 18, 26, 14, 30, 20, 28, 16, 24, 12, 22, 14, 26, 10, 8];
    const model = [6, 10, 16, 22, 18, 24, 20, 14, 18, 22, 16, 12, 8, 6, 10, 14, 10, 8, 6, 4, 6, 4];
    const user = [4, 8, 14, 20, 16, 22, 18, 12, 16, 18, 12, 10, 6, 8, 12, 10, 8, 6, 4, 4, 4, 4];
    const barCss = (h, c) => ({ style: 'display: block; width: 4px; height: ' + h + 'px; border-radius: 2px; background: ' + c + ';' });
    return {
      isIdle: step === 'ecoute',
      isRec: step === 'enregistrement',
      isReview: step === 'comparaison',
      notReview: step !== 'comparaison',
      liveBars: live.map((h, i) => ({ style: 'display: block; width: 5px; height: ' + h + 'px; border-radius: 3px; background: #C0262D; animation-delay: ' + (i * 0.06).toFixed(2) + 's;' })),
      modelBars: model.map((h) => barCss(h, '#0B5D3B')),
      userBars: user.map((h) => barCss(h, '#D9A400')),
      startRec: () => this.setState({ step: 'enregistrement' }),
      stopRec: () => this.setState({ step: 'comparaison' }),
      retry: () => this.setState({ step: 'ecoute' }),
      normAria: audio === 'norm' ? 'true' : 'false',
      slowAria: audio === 'slow' ? 'true' : 'false',
      playNorm: () => this.setState({ audio: audio === 'norm' ? null : 'norm' }),
      playSlow: () => this.setState({ audio: audio === 'slow' ? null : 'slow' }),
      slowStyle: 'width: 44px; height: 52px; border-radius: 16px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; ' + (audio === 'slow' ? 'background: #0B5D3B; color: #FFFFFF; border: 2px solid #0B5D3B;' : 'background: #E3F1E8; color: #0B5D3B; border: 2px solid #E3F1E8;')
    };
  }
}
WL.mount(Component, {"etape": "ecoute"});
</script>
</body>
</html>
