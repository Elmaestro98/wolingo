<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Exercice — dërëm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
.wl-radio:focus-visible + .wl-card{outline:3px solid #F2C230;outline-offset:2px}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; flex-shrink: 0">
    <a href="05-parcours.html" aria-label="Quitter la leçon" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la leçon" aria-valuenow="5" aria-valuemin="0" aria-valuemax="5" style="flex-grow: 1; height: 12px; border-radius: 99px; background: #E6DFD3; overflow: hidden">
      <div style="width: 96%; height: 100%; border-radius: 99px; background: #0B5D3B; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12)"></div>
    </div>
    <div aria-label="{{livesLabel}}" role="img" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 5px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E5484D" stroke="#B42318" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #B42318">{{lives}}</span>
    </div>
  </div>

  <div style="padding: 4px 20px 0">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5A00">Au marché · La monnaie</span>
    <h1 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: -0.02em">Comment dit-on ce prix en wolof ?</h1>

    <div style="margin-top: 14px; padding: 14px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06); display: flex; align-items: center; gap: 14px">
      <img src="assets/piece.jpg" alt="Une pièce de 500 francs CFA" style="width: 108px; height: 108px; object-fit: contain; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">500 F CFA</span>
        <span style="font-size: 14px; color: #5E564C">= combien de <strong lang="wo" style="color: #1E1B16">dërëm</strong> ?</span>
        <span style="align-self: flex-start; padding: 5px 10px; border-radius: 10px; background: #FCEFC7; font-size: 13px; font-weight: 800; color: #5A4300">1 <span lang="wo">dërëm</span> = 5 F CFA</span>
      </div>
    </div>
  </div>

  <fieldset style="border: none; margin: 16px 0 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Choisis le bon montant en dërëm</legend>
    <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
      <label style="display: block; cursor: pointer; position: relative">
        <input class="wl-radio" type="radio" name="derem" value="{{o.id}}" checked="{{o.selected}}" disabled="{{o.locked}}" onChange="{{o.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
        <div class="wl-card" style="{{o.cardStyle}}">
          <span style="{{o.keyStyle}}">{{o.key}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 800; color: {{o.textColor}}">{{o.wo}}</span>
            <sc-if value="{{o.reveal}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 12.5px; font-weight: 700; color: #5E564C">{{o.value}}</span>
            </sc-if>
          </span>
          <sc-if value="{{o.showOk}}" hint-placeholder-val="{{ false }}">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #0B5D3B; display: flex; align-items: center; justify-content: center" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{o.showKo}}" hint-placeholder-val="{{ false }}">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #C0262D; display: flex; align-items: center; justify-content: center" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
            </span>
          </sc-if>
        </div>
      </label>
    </sc-for>
  </fieldset>

  <div style="flex-grow: 1"></div>

  <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink: 0; padding: 14px 20px 24px; border-top: 1px solid #EFE8DC">
      <button type="button" disabled="{{noPick}}" onClick="{{check}}" style="{{checkStyle}}">Vérifier</button>
    </div>
  </sc-if>

  <sc-if value="{{showGood}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="flex-shrink: 0; padding: 18px 20px 24px; background: #D7EDDF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #0B5D3B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #08462C"><span lang="wo">Baax na !</span> Bien compté</span>
          <span style="font-size: 13px; font-weight: 700; color: #0B5D3B">+10 XP</span>
        </div>
      </div>
      <div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 800; color: #1E1B16; text-align: center">500 ÷ 5 = 100 → <span lang="wo" style="color: #0B5D3B">téeméer</span></div>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.4; color: #1F3D2C">Au marché, divise toujours le prix en francs CFA par 5 pour l'avoir en <span lang="wo">dërëm</span>.</p>
      <a href="16-construire-phrase.html" style="height: 56px; border-radius: 16px; background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">Continuer</a>
    </div>
  </sc-if>

  <sc-if value="{{showBad}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="flex-shrink: 0; padding: 18px 20px 24px; background: #FBE3E3; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #C0262D; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #8E1B20">Pas tout à fait…</span>
          <span style="font-size: 13.5px; font-weight: 700; color: #8E1B20">Bonne réponse : <span lang="wo">téémeri dërëm</span></span>
        </div>
      </div>
      <div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 800; color: #1E1B16; text-align: center">500 ÷ 5 = 100 → <span lang="wo" style="color: #8E1B20">téeméer</span></div>
      <button type="button" onClick="{{retry}}" style="height: 56px; border: none; border-radius: 16px; background: #C0262D; box-shadow: 0 5px 0 #8E1B20; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">J'ai compris</button>
    </div>
  </sc-if>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: undefined, checked: undefined };
  }
  renderVals() {
    const presets = {
      vide: { picked: null, checked: false },
      selection: { picked: 'a', checked: false },
      correct: { picked: 'a', checked: true },
      incorrect: { picked: 'd', checked: true }
    };
    const p = presets[this.props.etat ?? 'vide'] || presets.vide;
    const picked = this.state.picked !== undefined ? this.state.picked : p.picked;
    const checked = this.state.checked !== undefined ? this.state.checked : p.checked;
    const answer = 'a';
    const good = checked && picked === answer;
    const bad = checked && picked !== answer;
    const data = [
      { id: 'a', key: 'A', wo: 'téémeri dërëm', value: '100 dërëm = 500 F CFA' },
      { id: 'b', key: 'B', wo: 'fuki dërëm', value: '10 dërëm = 50 F CFA' },
      { id: 'c', key: 'C', wo: 'junni dërëm', value: '1 000 dërëm = 5 000 F CFA' },
      { id: 'd', key: 'D', wo: 'ñaar fuki dërëm', value: '20 dërëm = 100 F CFA' }
    ];
    const options = data.map((o) => {
      const sel = picked === o.id;
      const isAns = o.id === answer;
      let look = 'idle';
      if (!checked && sel) look = 'sel';
      if (checked && isAns) look = 'ok';
      if (checked && sel && !isAns) look = 'ko';
      if (checked && !sel && !isAns) look = 'dim';
      const st = {
        idle: ['#FFFFFF', '#ECE5D9', '#ECE5D9', '#F3EEE5', '#3D3730', '#1E1B16', '1'],
        sel: ['#E3F1E8', '#0B5D3B', '#0B5D3B', '#0B5D3B', '#FFFFFF', '#08462C', '1'],
        ok: ['#E3F1E8', '#0B5D3B', '#0B5D3B', '#0B5D3B', '#FFFFFF', '#08462C', '1'],
        ko: ['#FDECEC', '#C0262D', '#C0262D', '#C0262D', '#FFFFFF', '#8E1B20', '1'],
        dim: ['#FFFFFF', '#ECE5D9', '#ECE5D9', '#F3EEE5', '#3D3730', '#1E1B16', '0.6']
      }[look];
      return {
        ...o,
        selected: sel, locked: checked, reveal: checked,
        showOk: look === 'ok', showKo: look === 'ko',
        textColor: st[5],
        pick: () => { if (!checked) this.setState({ picked: o.id, checked: false }); },
        cardStyle: 'display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 8px 14px; border-radius: 16px; box-sizing: border-box; background: ' + st[0] + '; border: 2px solid ' + st[1] + '; box-shadow: 0 4px 0 ' + st[2] + '; opacity: ' + st[6] + ';',
        keyStyle: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; background: ' + st[3] + '; color: ' + st[4] + ';'
      };
    });
    const noPick = !picked;
    return {
      options,
      lives: bad ? 4 : 5, livesLabel: (bad ? 4 : 5) + ' vies',
      showCheck: !checked, showGood: good, showBad: bad, noPick,
      check: () => this.setState({ picked, checked: true }),
      retry: () => this.setState({ picked: null, checked: false }),
      checkStyle: 'width: 100%; height: 58px; border: none; border-radius: 16px; font-family: inherit; font-size: 18px; font-weight: 800; ' + (noPick ? 'background: #E6DFD3; color: #6B6258; cursor: not-allowed;' : 'background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; cursor: pointer;')
    };
  }
}
WL.mount(Component, {"etat": "vide"});
</script>
</body>
</html>
