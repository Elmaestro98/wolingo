<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Leçon — classes nominales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; flex-shrink: 0">
    <a href="05-parcours.html" aria-label="Quitter la leçon" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la leçon" aria-valuenow="2" aria-valuemin="0" aria-valuemax="5" style="flex-grow: 1; height: 12px; border-radius: 99px; background: #E6DFD3; overflow: hidden">
      <div style="width: 40%; height: 100%; border-radius: 99px; background: #0B5D3B; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12)"></div>
    </div>
    <div aria-label="5 vies" role="img" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 5px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E5484D" stroke="#B42318" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #B42318">5</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 6px 20px 20px; display: flex; flex-direction: column">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5A00">Découverte · Carnet de Dakar</span>
    <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.08; letter-spacing: -0.02em">Les classes nominales</h1>

    <section style="margin-top: 16px; padding: 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #FCEFC7; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"></path></svg>
        </div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">La règle d'or</h2>
      </div>
      <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.45; color: #3D3730">Chaque nom a une <strong>consonne de classe</strong>. Ajoute une voyelle pour former l'article : elle indique la distance.</p>
      <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 10px; border-radius: 14px; background: #E3F1E8; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; color: #0B5D3B">b + i = bi</span>
          <span style="font-size: 12.5px; font-weight: 700; color: #0B5D3B">ici, tout près</span>
        </div>
        <div style="padding: 10px; border-radius: 14px; background: #FCEFC7; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; color: #6B4700">b + a = ba</span>
          <span style="font-size: 12.5px; font-weight: 700; color: #6B4700">là-bas, plus loin</span>
        </div>
      </div>
    </section>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 22px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #5E564C">Exemples du quotidien</h2>
      <div role="group" aria-label="Distance" style="display: flex; padding: 3px; border-radius: 99px; background: #ECE5D9">
        <button type="button" aria-pressed="{{nearAria}}" onClick="{{setNear}}" style="{{nearStyle}}">Ici</button>
        <button type="button" aria-pressed="{{farAria}}" onClick="{{setFar}}" style="{{farStyle}}">Là-bas</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <div style="{{it.rowStyle}}">
          <img src="{{it.img}}" alt="{{it.alt}}" style="width: 64px; height: 64px; border-radius: 14px; object-fit: cover; flex-shrink: 0">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
              <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.1">{{it.noun}} <span style="color: {{it.artColor}}">{{it.art}}</span></span>
              <span style="padding: 2px 8px; border-radius: 99px; background: #F3EEE5; font-size: 11.5px; font-weight: 800; color: #3D3730">Classe {{it.cls}}</span>
            </div>
            <span style="font-size: 13.5px; line-height: 1.3; color: #5E564C">{{it.fr}}</span>
          </div>
          <button type="button" aria-label="{{it.label}}" aria-pressed="{{it.pressed}}" onClick="{{it.play}}" style="{{it.btnStyle}}">
            <sc-if value="{{it.playing}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"></path></svg>
            </sc-if>
            <sc-if value="{{it.idle}}" hint-placeholder-val="{{ true }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
            </sc-if>
          </button>
        </div>
      </sc-for>
    </div>

    <aside style="margin-top: 18px; padding: 14px; border-radius: 18px; background: #FCEFC7; display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #1E1B16; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2C230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4"></path><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.6 5H8.4a2 2 0 0 0-1.9 1.3L5 10 3 8"></path><rect x="3" y="10" width="18" height="8" rx="2"></rect><path d="M7 14h.01M17 14h.01"></path><path d="M5 18v2M19 18v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 14px; font-weight: 800; color: #3A2A00">Astuce du taxi jaune-noir</span>
        <span style="font-size: 13.5px; line-height: 1.4; color: #5A4300">Les mots empruntés prennent presque tous l'article <strong>bi</strong> : <em lang="wo" style="font-weight: 800; color: #3A2A00">taksi bi</em>, <em lang="wo" style="font-weight: 800; color: #3A2A00">otool bi</em>.</span>
      </div>
    </aside>
  </div>

  <div style="flex-shrink: 0; padding: 14px 20px 24px; background: #FBF7F0; border-top: 1px solid #EFE8DC">
    <a href="07-fiche-present-demonstratif.html" style="width: 100%; height: 58px; border-radius: 16px; background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; text-decoration: none; font-family: 'Nunito Sans', sans-serif; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer">Continuer</a>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { far: false, playing: 'bunt' };
  }
  renderVals() {
    const { far, playing } = this.state;
    const data = [
      { id: 'bunt', noun: 'bunt', c: 'b', cls: 'B', img: 'assets/porte.jpg', alt: 'Une porte en bois ancienne', near: 'cette porte-ci (tout près)', farTxt: 'cette porte-là (plus loin)' },
      { id: 'cin', noun: 'cin', c: 'l', cls: 'L', img: 'assets/marmite.jpg', alt: 'Une femme cuisine dans une marmite sur le feu', near: 'cette marmite-ci (sur le feu)', farTxt: 'cette marmite-là (plus loin)' },
      { id: 'nit', noun: 'nit', c: 'k', cls: 'K', img: 'assets/personne.jpg', alt: 'Une femme souriante dans une rue de Dakar', near: 'cette personne-ci (l’humain)', farTxt: 'cette personne-là (plus loin)' }
    ];
    const pill = (on) => 'height: 32px; padding: 0 14px; border: none; border-radius: 99px; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #1E1B16; box-shadow: 0 1px 2px rgba(30,27,22,0.15);' : 'background: transparent; color: #5E564C;');
    const items = data.map((d) => {
      const isPlaying = playing === d.id;
      const art = d.c + (far ? 'a' : 'i');
      return {
        noun: d.noun, art, cls: d.cls, img: d.img, alt: d.alt,
        fr: far ? d.farTxt : d.near,
        artColor: far ? '#8A5A00' : '#0B5D3B',
        playing: isPlaying, idle: !isPlaying,
        pressed: isPlaying ? 'true' : 'false',
        label: 'Écouter « ' + d.noun + ' ' + art + ' »',
        play: () => this.setState({ playing: isPlaying ? null : d.id }),
        rowStyle: 'display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 10px; border-radius: 18px; background: #FFFFFF; transition: border-color 0.15s; ' + (isPlaying ? 'border: 2px solid #0B5D3B;' : 'border: 2px solid #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06);'),
        btnStyle: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; ' + (isPlaying ? 'background: #0B5D3B;' : 'background: #E3F1E8;')
      };
    });
    return {
      items,
      nearAria: far ? 'false' : 'true',
      farAria: far ? 'true' : 'false',
      nearStyle: pill(!far),
      farStyle: pill(far),
      setNear: () => this.setState({ far: false }),
      setFar: () => this.setState({ far: true })
    };
  }
}
WL.mount(Component, {});
</script>
</body>
</html>
