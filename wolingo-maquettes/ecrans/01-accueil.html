<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column; padding: 20px 24px 28px; position: relative; overflow: hidden">

  <div style="position: absolute; top: -140px; left: 50%; margin-left: -260px; width: 520px; height: 520px; border-radius: 50%; background: #F6E7C4; opacity: 0.55" aria-hidden="true"></div>

  <div style="position: relative; display: flex; justify-content: center">
    <div style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 1px 2px rgba(30,27,22,0.08)">
      <svg width="20" height="14" viewBox="0 0 30 20" role="img" aria-label="Drapeau du Sénégal" style="border-radius: 3px; display: block">
        <rect width="10" height="20" fill="#00853F"></rect>
        <rect x="10" width="10" height="20" fill="#FDEF42"></rect>
        <rect x="20" width="10" height="20" fill="#E31B23"></rect>
        <polygon points="15,6.2 16.1,9.4 19.4,9.4 16.7,11.3 17.7,14.5 15,12.6 12.3,14.5 13.3,11.3 10.6,9.4 13.9,9.4" fill="#00853F"></polygon>
      </svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; color: #1E1B16">Wolingo</span>
    </div>
  </div>

  <div style="position: relative; display: flex; justify-content: center; margin-top: 22px; height: 236px">
    <div style="width: 236px; height: 236px; border-radius: 50%; background: #FFFFFF; padding: 8px; box-sizing: border-box; box-shadow: 0 18px 40px -18px rgba(140,98,10,0.55), inset 0 0 0 4px #F2C230">
      <img src="assets/mascotte.png" alt="Moussa, la mascotte de Wolingo, fait un signe de la main" style="width: 220px; height: 220px; border-radius: 50%; object-fit: cover; display: block">
    </div>
    <sc-if value="{{showBubble}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; top: 6px; right: 0px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; background: #FFFFFF; border-radius: 18px 18px 18px 4px; box-shadow: 0 6px 18px -6px rgba(30,27,22,0.25)">
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; line-height: 1.1; color: #1E1B16">Nanga def ?</span>
          <span style="font-size: 12px; line-height: 1.3; color: #5E564C">Comment ça va ?</span>
        </div>
        <button type="button" aria-label="Écouter la prononciation" style="width: 36px; height: 36px; border: none; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        </button>
      </div>
    </sc-if>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 22px; gap: 6px">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #8A5A00">Teranga Ndakarou</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; color: #1E1B16">Dalal ak jàmm !</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5E564C">« Sois le bienvenu en paix » — apprends le wolof<br>en <strong style="color: {{accent}}; font-weight: 800">5 minutes par jour</strong>, même sans internet.</p>
  </div>

  <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; background: #FFFFFF; border-radius: 16px; text-align: center">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #E3F1E8; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"></path><path d="M9 11h.01M12 11h.01M15 11h.01"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 800; line-height: 1.2">Wolof authentique</span>
        <span style="font-size: 11.5px; line-height: 1.3; color: #5E564C">Le parler de tous les jours</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; background: #FFFFFF; border-radius: 16px; text-align: center">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FCEFC7; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 800; line-height: 1.2">5 min par jour</span>
        <span style="font-size: 11.5px; line-height: 1.3; color: #5E564C">Des leçons courtes</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; background: #FFFFFF; border-radius: 16px; text-align: center">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #ECE7DF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 2 20 20"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M5 12.9a10 10 0 0 1 5.2-2.8"></path><path d="M19 12.9a10 10 0 0 0-2.3-1.7"></path><path d="M2 8.8a15 15 0 0 1 4.2-2.6"></path><path d="M10.7 5.1A15 15 0 0 1 22 8.8"></path><path d="M12 20h.01"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 800; line-height: 1.2">100 % hors-ligne</span>
        <span style="font-size: 11.5px; line-height: 1.3; color: #5E564C">Partout, sans réseau</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 6px">
    <a href="02-objectif.html" style="height: 58px; border-radius: 16px; background: {{accent}}; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; text-decoration: none; font-family: 'Nunito Sans', sans-serif; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      Commencer l'aventure
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
    </a>
    <a href="04-niveau.html" style="height: 48px; margin-top: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{accent}}; font-family: 'Nunito Sans', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">J'ai déjà des bases · Test de niveau</a>
    <p style="margin: 4px 0 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #6B6258">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      Conçu au Sénégal pour faire rayonner notre patrimoine
    </p>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#0B5D3B',
      showBubble: this.props.showBubble ?? true
    };
  }
}
WL.mount(Component, {"accent": "#0B5D3B", "showBubble": true});
</script>
</body>
</html>
