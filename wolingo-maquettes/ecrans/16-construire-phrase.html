<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Construire la phrase — réussite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
@keyframes wl-up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.wl-sheet{animation:wl-up 0.35s cubic-bezier(.2,.8,.2,1) both}
@keyframes wl-peek{from{transform:translateY(60px)}to{transform:translateY(0)}}
.wl-lion{animation:wl-peek 0.5s 0.15s cubic-bezier(.2,.9,.3,1.2) both}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; flex-shrink: 0">
    <a href="05-parcours.html" aria-label="Quitter la leçon" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la leçon" aria-valuenow="4" aria-valuemin="0" aria-valuemax="5" style="flex-grow: 1; height: 12px; border-radius: 99px; background: #E6DFD3; overflow: hidden">
      <div style="width: 84%; height: 100%; border-radius: 99px; background: #0B5D3B; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12)"></div>
    </div>
    <div aria-label="{{livesLabel}}" role="img" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 5px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E5484D" stroke="#B42318" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #B42318">{{lives}}</span>
    </div>
  </div>

  <div style="padding: 4px 20px 0">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5A00">Présent continu</span>
    <h1 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: -0.02em">Construis la phrase en wolof</h1>

    <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
      <button type="button" aria-label="Écouter la phrase" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #E3F1E8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      </button>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 800; line-height: 1.25">« Diop est en train de s'en aller. »</span>
    </div>
  </div>

  <div aria-label="Ta réponse" role="group" style="margin: 20px 20px 0; min-height: 112px; padding: 6px 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 55px, #DCD2C2 55px, #DCD2C2 57px)">
    <sc-for list="{{placed}}" as="w" hint-placeholder-count="3">
      <button type="button" onClick="{{w.tap}}" aria-label="Retirer {{w.t}}" lang="wo" style="{{w.style}}">{{w.t}}</button>
    </sc-for>
  </div>

  <div role="group" aria-label="Mots disponibles" style="margin: 22px 20px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
    <sc-for list="{{bank}}" as="w" hint-placeholder-count="6">
      <button type="button" onClick="{{w.tap}}" disabled="{{w.used}}" lang="wo" style="{{w.style}}">{{w.t}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink: 0; padding: 14px 20px 24px; border-top: 1px solid #EFE8DC">
      <button type="button" disabled="{{noPick}}" onClick="{{check}}" style="{{checkStyle}}">Vérifier</button>
    </div>
  </sc-if>

  <sc-if value="{{showGood}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(30,27,22,0.35)" aria-hidden="true"></div>
    <img class="wl-lion" src="assets/lion-buste.png" alt="" style="position: absolute; right: 8px; bottom: 372px; width: 168px; height: auto; z-index: 1">
    <div class="wl-sheet" role="status" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 22px 20px 26px; background: #0B5D3B; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 16px; color: #FFFFFF">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column">
          <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; line-height: 1.05">Baax na !</span>
          <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #A8DDBB">Excellent</span>
        </div>
        <span style="padding: 8px 12px; border-radius: 99px; background: #F2C230; color: #3A2A00; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#3A2A00" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
          +10 XP
        </span>
      </div>
      <div style="padding: 16px; border-radius: 18px; background: rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">Joob <span style="color: #F7D867">angiy</span> dem</span>
          <button type="button" aria-label="Écouter la bonne réponse" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          </button>
        </div>
        <span style="font-size: 14.5px; font-style: italic; color: #D5EADD">« Diop est en train de s'en aller. »</span>
        <span style="font-size: 13px; line-height: 1.4; color: #D5EADD"><strong lang="wo" style="color: #F7D867">angiy</strong> + verbe = une action en cours.</span>
      </div>
      <a href="18-lecon-terminee.html" style="height: 56px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 5px 0 #063A24; color: #0B5D3B; text-decoration: none; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
        Continuer
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </a>
    </div>
  </sc-if>

  <sc-if value="{{showBad}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(30,27,22,0.35)" aria-hidden="true"></div>
    <div class="wl-sheet" role="status" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 22px 20px 14px; background: #FFF1F1; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #C0262D; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; line-height: 1.05; color: #8E1B20">Pas tout à fait</span>
          <span style="font-size: 13.5px; font-weight: 700; color: #A3242A">Ne te décourage pas !</span>
        </div>
        <span role="img" aria-label="1 vie perdue" style="height: 36px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; border: 1px solid #F3C5C5; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #B42318">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
          −1
        </span>
      </div>
      <div style="padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #F6D6D6; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6258">Ta réponse</span>
          <span lang="wo" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 17px; font-weight: 800">
            <sc-for list="{{userWords}}" as="u" hint-placeholder-count="3"><span style="{{u.style}}">{{u.t}}</span></sc-for>
          </span>
        </div>
        <div style="height: 1px; background: #F3ECE2"></div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #0B5D3B">Bonne réponse</span>
            <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">Joob <span style="color: #0B5D3B; text-decoration: underline; text-decoration-color: #F2C230; text-decoration-thickness: 3px; text-underline-offset: 4px">angiy</span> dem</span>
            <span style="font-size: 14px; font-style: italic; color: #5E564C">« Diop est en train de s'en aller. »</span>
          </div>
          <button type="button" aria-label="Écouter la bonne réponse" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #E3F1E8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          </button>
        </div>
        <div style="display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #FCEFC7">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M9 18h6M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"></path></svg>
          <span style="font-size: 13.5px; line-height: 1.4; color: #5A4300"><strong>a + ngi + di</strong> se contracte en <strong lang="wo">angiy</strong> : sujet + <strong lang="wo">angiy</strong> + verbe = action en cours.</span>
        </div>
      </div>
      <button type="button" onClick="{{retry}}" style="height: 56px; border: none; border-radius: 16px; background: #C0262D; box-shadow: 0 5px 0 #8E1B20; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        Compris
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </button>
      <a href="#signaler" style="height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #5E564C; font-size: 14px; font-weight: 800">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E564C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"></path><path d="M4 4h12l-2 4 2 4H4"></path></svg>
        Signaler un problème
      </a>
    </div>
  </sc-if>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { touched: false, placed: [], checked: false };
  }
  preset() {
    const e = this.props.etat ?? 'reussite';
    if (e === 'vide') return { placed: [], checked: false };
    if (e === 'construction') return { placed: [0, 2], checked: false };
    if (e === 'erreur') return { placed: [0, 1, 4], checked: true };
    return { placed: [0, 2, 4], checked: true };
  }
  renderVals() {
    const s = this.state.touched ? this.state : this.preset();
    const { placed, checked } = s;
    const words = ['Joob', 'lekk', 'angiy', 'fale', 'dem', 'Faatu'];
    const answer = 'Joob angiy dem';
    const sentence = placed.map((i) => words[i]).join(' ');
    const good = checked && sentence === answer;
    const bad = checked && !good;
    const set = (patch) => this.setState(Object.assign({ touched: true, placed, checked }, patch));
    const tile = 'height: 48px; padding: 0 16px; border-radius: 14px; font-family: "Bricolage Grotesque", sans-serif; font-size: 19px; font-weight: 800; ';
    const bank = words.map((t, i) => {
      const used = placed.indexOf(i) >= 0;
      return {
        t, used,
        tap: () => { if (!used && !checked) set({ placed: placed.concat([i]) }); },
        style: tile + (used ? 'background: #ECE5D9; color: transparent; border: 2px solid #ECE5D9; box-shadow: none; cursor: default;' : 'background: #FFFFFF; color: #1E1B16; border: 2px solid #ECE5D9; box-shadow: 0 4px 0 #ECE5D9; cursor: pointer;')
      };
    });
    const placedList = placed.map((i, k) => ({
      t: words[i],
      tap: () => { if (!checked) set({ placed: placed.filter((_, j) => j !== k) }); },
      style: tile + 'cursor: pointer; ' + (good ? 'background: #E3F1E8; color: #08462C; border: 2px solid #0B5D3B; box-shadow: 0 4px 0 #0B5D3B;' : bad ? 'background: #FDECEC; color: #8E1B20; border: 2px solid #C0262D; box-shadow: 0 4px 0 #C0262D;' : 'background: #FFFFFF; color: #1E1B16; border: 2px solid #ECE5D9; box-shadow: 0 4px 0 #ECE5D9;')
    }));
    const noPick = placed.length === 0;
    const answerWords = answer.split(' ');
    const userWords = placed.map((i, k) => {
      const ok = words[i] === answerWords[k];
      return { t: words[i], style: ok ? 'color: #1E1B16;' : 'color: #B42318; text-decoration: line-through; text-decoration-thickness: 2px;' };
    });
    return {
      bank, placed: placedList, userWords,
      lives: bad ? 4 : 5, livesLabel: (bad ? 4 : 5) + ' vies',
      showCheck: !checked, showGood: good, showBad: bad, noPick,
      check: () => set({ checked: true }),
      retry: () => set({ placed: [], checked: false }),
      checkStyle: 'width: 100%; height: 58px; border: none; border-radius: 16px; font-family: inherit; font-size: 18px; font-weight: 800; ' + (noPick ? 'background: #E6DFD3; color: #6B6258; cursor: not-allowed;' : 'background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; cursor: pointer;')
    };
  }
}
WL.mount(Component, {"etat": "reussite"});
</script>
</body>
</html>
