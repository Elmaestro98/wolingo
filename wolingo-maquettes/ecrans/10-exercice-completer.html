<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Exercice — compléter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; flex-shrink: 0">
    <a href="05-parcours.html" aria-label="Quitter la leçon" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la leçon" aria-valuenow="4" aria-valuemin="0" aria-valuemax="5" style="flex-grow: 1; height: 12px; border-radius: 99px; background: #E6DFD3; overflow: hidden">
      <div style="width: 88%; height: 100%; border-radius: 99px; background: #0B5D3B; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12)"></div>
    </div>
    <div aria-label="{{livesLabel}}" role="img" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 5px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E5484D" stroke="#B42318" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #B42318">{{lives}}</span>
    </div>
  </div>

  <div style="padding: 6px 20px 0">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5A00">Présent d'action</span>
    <h1 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: -0.02em">Complète la phrase</h1>

    <div style="margin-top: 14px; padding: 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
      <div style="display: flex; align-items: center; gap: 12px">
        <img src="assets/baye.png" alt="" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #FCEFC7">
        <div style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 800">Baye le mouton</span>
          <span style="font-size: 12.5px; color: #5E564C">raconte sa journée</span>
        </div>
        <button type="button" aria-label="Écouter la phrase" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; border: none; background: #0B5D3B; box-shadow: 0 4px 0 #063A24; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        </button>
      </div>
      <p lang="wo" style="margin: 18px 0 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.2">
        <span>Xar bi</span>
        <span style="{{slotStyle}}">{{slotText}}</span>
        <span>lekk xob wi</span>
      </p>
      <p style="margin: 14px 0 0; text-align: center; font-size: 14.5px; font-style: italic; color: #5E564C">« Le mouton mange la feuille »</p>
    </div>
  </div>

  <div style="padding: 20px 20px 0">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #5E564C">Choisis la particule</h2>
      <button type="button" aria-expanded="{{hintAria}}" onClick="{{toggleHint}}" style="height: 36px; padding: 0 12px; border: none; border-radius: 99px; background: #FCEFC7; color: #6B4700; font-family: inherit; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"></path></svg>
        Indice
      </button>
    </div>
    <sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: #FCEFC7; font-size: 13.5px; line-height: 1.4; color: #5A4300">Le sujet, <em lang="wo">xar bi</em>, est à la 3ᵉ personne du singulier (il / elle).</p>
    </sc-if>
    <div role="radiogroup" aria-label="Particules" style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{o.ariaChecked}}" disabled="{{o.locked}}" onClick="{{o.pick}}" lang="wo" style="{{o.style}}">{{o.word}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink: 0; padding: 14px 20px 24px; border-top: 1px solid #EFE8DC">
      <button type="button" disabled="{{noPick}}" onClick="{{check}}" style="{{checkStyle}}">Vérifier</button>
    </div>
  </sc-if>

  <sc-if value="{{showGood}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="flex-shrink: 0; padding: 18px 20px 24px; background: #D7EDDF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #0B5D3B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #08462C"><span lang="wo">Baax na !</span> Bravo</span>
          <span style="font-size: 13px; font-weight: 700; color: #0B5D3B">+10 XP</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #1F3D2C"><strong lang="wo">mungiy</strong> = <em lang="wo">mungi</em> + <em lang="wo">-y</em> : une action en train de se faire, pour il / elle.</p>
      <button type="button" style="height: 52px; border-radius: 14px; border: 2px solid #0B5D3B; background: #FFFFFF; color: #0B5D3B; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v4"></path></svg>
        Répète après Baye · +5 XP
      </button>
      <a href="11-exercice-associer.html" style="height: 56px; border-radius: 16px; background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">Continuer</a>
    </div>
  </sc-if>

  <sc-if value="{{showBad}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="flex-shrink: 0; padding: 18px 20px 24px; background: #FBE3E3; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #C0262D; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #8E1B20">Pas tout à fait…</span>
          <span style="font-size: 13.5px; font-weight: 700; color: #8E1B20">Bonne réponse : <span lang="wo">mungiy</span></span>
        </div>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #5C1A1D"><em lang="wo">Xar bi</em> est à la 3ᵉ personne : on utilise <strong lang="wo">mungiy</strong> (<em lang="wo">mungi</em> + <em lang="wo">-y</em>) pour une action en cours.</p>
      <button type="button" onClick="{{retry}}" style="height: 56px; border: none; border-radius: 16px; background: #C0262D; box-shadow: 0 5px 0 #8E1B20; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">J'ai compris</button>
    </div>
  </sc-if>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: undefined, checked: undefined, hint: false };
  }
  renderVals() {
    const presets = {
      vide: { picked: null, checked: false },
      selection: { picked: 'mungiy', checked: false },
      correct: { picked: 'mungiy', checked: true },
      incorrect: { picked: 'angiy', checked: true }
    };
    const p = presets[this.props.etat ?? 'vide'] || presets.vide;
    const picked = this.state.picked !== undefined ? this.state.picked : p.picked;
    const checked = this.state.checked !== undefined ? this.state.checked : p.checked;
    const answer = 'mungiy';
    const good = checked && picked === answer;
    const bad = checked && picked !== answer;
    const words = ['angiy', 'bangiy', 'mungiy', 'laa'];
    const options = words.map((w) => {
      const sel = picked === w;
      let look = 'idle';
      if (!checked && sel) look = 'sel';
      if (checked && w === answer) look = 'ok';
      if (checked && sel && w !== answer) look = 'ko';
      if (checked && !sel && w !== answer) look = 'dim';
      const s = {
        idle: 'background: #FFFFFF; border: 2px solid #ECE5D9; box-shadow: 0 4px 0 #ECE5D9; color: #1E1B16;',
        sel: 'background: #E3F1E8; border: 2px solid #0B5D3B; box-shadow: 0 4px 0 #0B5D3B; color: #08462C;',
        ok: 'background: #E3F1E8; border: 2px solid #0B5D3B; box-shadow: 0 4px 0 #0B5D3B; color: #08462C;',
        ko: 'background: #FDECEC; border: 2px solid #C0262D; box-shadow: 0 4px 0 #C0262D; color: #8E1B20;',
        dim: 'background: #FFFFFF; border: 2px solid #ECE5D9; box-shadow: 0 4px 0 #ECE5D9; color: #1E1B16; opacity: 0.45;'
      }[look];
      return {
        word: w,
        ariaChecked: sel ? 'true' : 'false',
        locked: checked,
        pick: () => { if (!checked) this.setState({ picked: w, checked: false }); },
        style: 'height: 64px; border-radius: 16px; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer; padding: 0; ' + s
      };
    });
    let slotStyle = 'min-width: 118px; height: 52px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; ';
    let slotText = '';
    if (!picked) slotStyle += 'border-bottom: 3px dashed #CFC6B8; background: #F3EEE5;';
    else if (bad) { slotText = picked; slotStyle += 'background: #FDECEC; color: #C0262D; border-bottom: 3px solid #C0262D; text-decoration: line-through;'; }
    else { slotText = picked; slotStyle += 'background: #E3F1E8; color: #0B5D3B; border-bottom: 3px solid #0B5D3B;'; }
    const noPick = !picked;
    return {
      options, slotStyle, slotText,
      lives: bad ? 4 : 5,
      livesLabel: (bad ? 4 : 5) + ' vies',
      showHint: this.state.hint && !checked,
      hintAria: this.state.hint ? 'true' : 'false',
      toggleHint: () => this.setState({ hint: !this.state.hint }),
      showCheck: !checked, showGood: good, showBad: bad, noPick,
      check: () => this.setState({ picked, checked: true }),
      retry: () => this.setState({ picked: null, checked: false }),
      checkStyle: 'width: 100%; height: 58px; border: none; border-radius: 16px; font-family: inherit; font-size: 18px; font-weight: 800; ' + (noPick ? 'background: #E6DFD3; color: #6B6258; cursor: not-allowed;' : 'background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; cursor: pointer;')
    };
  }
}
WL.mount(Component, {"etat": "vide"});
</script>
</body>
</html>
