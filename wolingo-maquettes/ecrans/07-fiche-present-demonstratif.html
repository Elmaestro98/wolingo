<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolingo — Fiche — présent démonstratif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F0}
a{color:#0B5D3B}a:hover{color:#08462C}
</style>
<style>
html{background:#E9E4DA}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;background:#E9E4DA}
#app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(30,27,22,0.35);background:#FBF7F0}
@media (max-width:480px){body{padding:0;background:#FBF7F0}#app{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; font-family: 'Nunito Sans', system-ui, sans-serif; color: #1E1B16; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; flex-shrink: 0">
    <a href="05-parcours.html" aria-label="Quitter la leçon" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D3730" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la leçon" aria-valuenow="3" aria-valuemin="0" aria-valuemax="5" style="flex-grow: 1; height: 12px; border-radius: 99px; background: #E6DFD3; overflow: hidden">
      <div style="width: 60%; height: 100%; border-radius: 99px; background: #0B5D3B; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12)"></div>
    </div>
    <div aria-label="5 vies" role="img" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 5px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E5484D" stroke="#B42318" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #B42318">5</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 6px 20px 20px; display: flex; flex-direction: column">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #8A5A00">Point grammaire · Leçon 1</span>
    <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.08; letter-spacing: -0.02em">Le présent démonstratif</h1>
    <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #5E564C">Pour dire où l'on se trouve, ou annoncer ce qu'on fait en ce moment.</p>

    <div style="display: flex; gap: 12px; align-items: center; margin-top: 14px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
      <img src="assets/awa.png" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0">
      <p style="margin: 0; font-size: 13.5px; line-height: 1.4; color: #3D3730"><strong style="color: #0B5D3B">Awa :</strong> c'est le temps du « me voici ! ». Repère la terminaison <strong style="color: #0B5D3B">-ngi</strong>, elle ne change jamais.</p>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 22px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #5E564C">Conjugaison</h2>
      <button type="button" onClick="{{playAll}}" style="height: 36px; padding: 0 12px; border: none; border-radius: 99px; background: #E3F1E8; color: #0B5D3B; font-family: inherit; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#0B5D3B" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"></path></svg>
        Tout écouter
      </button>
    </div>

    <div role="table" aria-label="Conjugaison du présent démonstratif" style="margin-top: 10px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06); overflow: hidden">
      <div role="row" style="display: grid; grid-template-columns: 112px minmax(0, 1fr) 48px; gap: 10px; padding: 10px 14px; background: #F3EEE5">
        <span role="columnheader" style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5E564C">Pronom</span>
        <span role="columnheader" style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5E564C">Forme wolof</span>
        <span role="columnheader" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Audio</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div role="row" style="{{r.rowStyle}}">
          <div role="cell" style="display: flex; flex-direction: column; gap: 1px">
            <span lang="wo" style="font-size: 17px; font-weight: 800">{{r.pro}}</span>
            <span style="font-size: 12.5px; color: #5E564C">{{r.proFr}}</span>
          </div>
          <div role="cell" style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span lang="wo" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.15">{{r.stem}}<span style="color: #0B5D3B; text-decoration: underline; text-decoration-color: #F2C230; text-decoration-thickness: 3px; text-underline-offset: 4px">ngi</span></span>
            <span style="font-size: 12.5px; color: #5E564C">{{r.fr}}</span>
          </div>
          <div role="cell" style="display: flex; align-items: center; justify-content: flex-end">
            <button type="button" aria-label="{{r.label}}" aria-pressed="{{r.pressed}}" onClick="{{r.play}}" style="{{r.btnStyle}}">
              <sc-if value="{{r.playing}}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"></path></svg>
              </sc-if>
              <sc-if value="{{r.idle}}" hint-placeholder-val="{{ true }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
              </sc-if>
            </button>
          </div>
        </div>
      </sc-for>
    </div>

    <section style="margin-top: 18px; padding: 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30,27,22,0.06)">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #FCEFC7; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"></path></svg>
        </div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">Proche ou éloigné ?</h2>
      </div>
      <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 12px; border-radius: 14px; background: #E3F1E8; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; color: #0B5D3B">-ngi</span>
          <span style="font-size: 12.5px; font-weight: 700; color: #0B5D3B">voici · tout près</span>
          <span lang="wo" style="margin-top: 4px; font-size: 14px; font-weight: 800; color: #1E1B16">Mangi fi</span>
          <span style="font-size: 12px; color: #3D3730">Me voici ici</span>
        </div>
        <div style="padding: 12px; border-radius: 14px; background: #FCEFC7; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; color: #6B4700">-ngë</span>
          <span style="font-size: 12.5px; font-weight: 700; color: #6B4700">voilà · plus loin</span>
          <span lang="wo" style="margin-top: 4px; font-size: 14px; font-weight: 800; color: #1E1B16">Mangë fale</span>
          <span style="font-size: 12px; color: #3D3730">Me voilà là-bas</span>
        </div>
      </div>
    </section>
  </div>

  <div style="flex-shrink: 0; padding: 14px 20px 24px; background: #FBF7F0; border-top: 1px solid #EFE8DC">
    <a href="08-exercice-traduction.html" style="width: 100%; height: 58px; border-radius: 16px; background: #0B5D3B; box-shadow: 0 5px 0 #063A24; color: #FFFFFF; text-decoration: none; font-family: 'Nunito Sans', sans-serif; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer">Continuer</a>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: null };
  }
  renderVals() {
    const { playing } = this.state;
    const data = [
      { id: 'man', pro: 'man', proFr: 'moi, je', stem: 'ma', fr: 'je suis là, me voici' },
      { id: 'yow', pro: 'yow', proFr: 'toi, tu', stem: 'ya', fr: 'tu es là, te voici' },
      { id: 'moom', pro: 'moom', proFr: 'lui, elle', stem: 'mu', fr: 'il / elle est là' },
      { id: 'nun', pro: 'ñun', proFr: 'nous', stem: 'ñu', fr: 'nous sommes là' },
      { id: 'yeen', pro: 'yéen', proFr: 'vous', stem: 'yééna', fr: 'vous êtes là' },
      { id: 'noom', pro: 'ñoom', proFr: 'eux, elles', stem: 'ñu', fr: 'ils / elles sont là' }
    ];
    const rows = data.map((d, i) => {
      const on = playing === d.id;
      return {
        ...d,
        playing: on, idle: !on,
        pressed: on ? 'true' : 'false',
        label: 'Écouter « ' + d.stem + 'ngi »',
        play: () => this.setState({ playing: on ? null : d.id }),
        rowStyle: 'display: grid; grid-template-columns: 112px minmax(0, 1fr) 48px; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid #F0EADF; ' + (on ? 'background: #E3F1E8;' : 'background: #FFFFFF;'),
        btnStyle: 'width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; ' + (on ? 'background: #0B5D3B;' : 'background: #E3F1E8;')
      };
    });
    return {
      rows,
      playAll: () => this.setState({ playing: 'man' })
    };
  }
}
WL.mount(Component, {});
</script>
</body>
</html>
